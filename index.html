/* ============================================
   每日场景动态 - 明亮蓝白主题
   ============================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --bg-soft: #f3f7ff;
  --bg-card: #ffffff;
  --bg-card-hover: #f8fbff;
  --bg-input: #f1f5fb;
  --border: #d6e3f8;
  --text: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --accent: #2563eb;
  --accent-dark: #1d4ed8;
  --accent-soft: #e8f1ff;
  --accent-ai: #7c3aed;
  --accent-ai-soft: #ede9fe;
  --accent-hot: #ea580c;
  --accent-hot-soft: #ffedd5;
  --accent-green: #16a34a;
  --accent-green-soft: #dcfce7;
  --accent-orange: #d97706;
  --accent-orange-soft: #fef3c7;
  --accent-rose: #e11d48;
  --accent-rose-soft: #ffe4e6;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(37, 99, 235, 0.08);
  --shadow-3d: 0 4px 0 #bfdbfe, 0 6px 12px rgba(37, 99, 235, 0.12);
  --shadow-3d-active: 0 1px 0 #bfdbfe;
  --max-width: 1200px;
  --header-height: 64px;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-soft); }
::-webkit-scrollbar-thumb { background: #c8d9f8; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #93c5fd; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: clip; /* 防止移动端横向溢出，且不影响 sticky 定位 */
}

  height: 360px;
  background: radial-gradient(closest-side, rgba(96, 165, 250, 0.22), rgba(124, 58, 237, 0.10) 55%, transparent 75%);
  filter: blur(24px);
  pointer-events: none;
}

.hero-inner {
  position: relative;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 54px 24px 42px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.hero-main {
  position: relative;
  display: inline-block;
}

.hero-title-bg {
  position: absolute;
  inset: -30px -40px -20px -40px;
  z-index: 0;
  background: radial-gradient(closest-side, rgba(59, 130, 246, 0.25), transparent 70%);
  filter: blur(20px);
  pointer-events: none;
}

.hero-title {
  position: relative;
  z-index: 1;
  font-size: clamp(34px, 5vw, 54px);
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1.1;
  color: #ffffff;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}

.hero-subtitle {
  position: relative;
  z-index: 1;
  margin-top: 12px;
  font-size: 13.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.88);
  letter-spacing: 1.2px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
  max-width: 760px;
  line-height: 1.6;
}

.hero-view-count {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.92);
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  padding: 4px 14px;
  letter-spacing: 0.5px;
  backdrop-filter: blur(4px);
}

.hero-view-count b {
  color: #60a5fa;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin-left: 2px;
}

.hero-scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.08;
  pointer-events: none;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.9);
  padding: 9px 15px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 22px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  white-space: nowrap;
  backdrop-filter: blur(6px);
}

/* ============ 布局：左栏 + 内容 ============ */
.layout {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 24px;
  padding: 24px;
}

.sidebar {
  width: 280px;
  flex-shrink: 0;
  position: sticky;
  top: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 12px;
  box-shadow: var(--shadow);
  align-self: flex-start;
}

#newsBtn {
  margin-bottom: 10px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 立体按钮 */
.sidebar-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 15px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s ease;
  border: 1px solid #bfdbfe;
  background: linear-gradient(180deg, #ffffff 0%, #f0f6ff 100%);
  box-shadow: 0 4px 0 #93c5fd, 0 6px 12px rgba(37, 99, 235, 0.14);
  font-family: inherit;
  text-align: left;
  width: 100%;
}

.sidebar-item:hover {
  background: linear-gradient(180deg, #ffffff 0%, #e8f1ff 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #93c5fd, 0 10px 18px rgba(37, 99, 235, 0.18);
}

.sidebar-item.active {
  background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
  color: #fff;
  border-color: #1d4ed8;
  box-shadow: 0 2px 0 #1e40af, inset 0 2px 4px rgba(0, 0, 0, 0.12);
  transform: translateY(3px);
  font-weight: 800;
}

.sidebar-item .side-count {
  font-size: 11px;
  background: var(--bg-input);
  color: var(--text-muted);
  padding: 1px 9px;
  border-radius: 10px;
  transition: all 0.2s;
}

.sidebar-item.active .side-count {
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
}

.side-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 600;
}

.cat-icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  opacity: 0.85;
}

.sidebar-item.active .cat-icon {
  opacity: 1;
}

.sidebar-tip {
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  opacity: 0.8;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 14px 8px 12px;
}

/* 长城战略咨询深度解读：侧边栏大按钮 */
.sidebar-interpret {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 16px 14px;
  font-size: 15px;
  font-weight: 700;
  color: #4c1d95;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s ease;
  border: 1px solid #ddd6fe;
  background: linear-gradient(180deg, #ffffff 0%, #f5f3ff 100%);
  box-shadow: 0 4px 0 #a78bfa, 0 6px 12px rgba(124, 58, 237, 0.14);
  font-family: inherit;
  text-align: left;
  width: 100%;
}

.sidebar-interpret:hover {
  background: linear-gradient(180deg, #ffffff 0%, #ede9fe 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #a78bfa, 0 10px 18px rgba(124, 58, 237, 0.18);
}

.sidebar-interpret.active {
  background: linear-gradient(180deg, #7c3aed 0%, #6d28d9 100%);
  color: #fff;
  border-color: #5b21b6;
  box-shadow: 0 2px 0 #4c1d95, inset 0 2px 4px rgba(0, 0, 0, 0.12);
  transform: translateY(3px);
}

.sidebar-interpret .side-label {
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1.35;
}

.sidebar-interpret .side-label .side-text {
  white-space: nowrap;
}

.sidebar-interpret .cat-icon {
  width: 22px;
  height: 22px;
  color: currentColor;
}

.main {
  flex: 1;
  min-width: 0;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0 12px;
  height: 38px;
  transition: all 0.2s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.search-icon {
  color: var(--text-muted);
  flex-shrink: 0;
}

.search-input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 13px;
  width: auto;
  flex: 1;
  min-width: 0;
  font-family: inherit;
}

.search-input::placeholder { color: var(--text-muted); }

/* 搜索按钮与清除按钮 */
.search-btn {
  flex-shrink: 0;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 16px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.search-btn:hover { background: var(--accent-dark); }
.search-btn:active { transform: translateY(1px); }

.search-clear {
  flex-shrink: 0;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
  font-family: inherit;
}
.search-clear:hover { color: var(--text); }

.update-info {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

.update-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============ 概览栏 ============ */
.overview {
  margin-bottom: 28px;
}

.overview-cards {
  display: flex;
  gap: 16px;
}

.overview-card {
  flex: 1;
  background: linear-gradient(180deg, #ffffff 0%, #f3f7ff 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-3d);
}

.overview-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #bfdbfe, 0 10px 18px rgba(37, 99, 235, 0.13);
}

.overview-num {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.overview-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* ============ 场景释义卡片 ============ */
.concept {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

.concept-inner {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-top: 10px;
  padding: 18px 24px;
  background: linear-gradient(120deg, #ffffff 0%, #f3f7ff 100%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.concept-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.concept-text {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.75;
}

.ov-icon {
  width: 22px;
  height: 22px;
  color: var(--accent);
  opacity: 0.9;
  margin-bottom: 8px;
}

/* ============ 当日 / 往日 板块 ============ */
.period {
  margin-bottom: 32px;
}

/* 往日动态板块：与「当日」明显区分，避免长列表时视觉混在一起 */
#pastSection {
  background: #f6f8fb;
  border: 1px solid var(--border);
  border-top: 3px solid #cbd5e1;
  border-radius: 16px;
  padding: 18px 20px 10px;
  margin-top: 6px;
}

.period-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.period-sub {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0;
}

.period-icon {
  width: 20px;
  height: 20px;
  color: var(--accent);
}

.period-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text);
}

.period-date {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: 2px;
}

.date-nav {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.date-nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  box-shadow: 0 2px 0 var(--border), 0 2px 5px rgba(37, 99, 235, 0.06);
  transition: all .12s ease;
}

.date-nav-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 3px 0 #bfdbfe, 0 4px 8px rgba(37, 99, 235, 0.1);
  color: var(--accent);
  border-color: #bfdbfe;
}

.date-nav-btn.active {
  background: linear-gradient(180deg, #3b82f6 0%, var(--accent) 100%);
  color: #fff;
  border-color: var(--accent-dark);
  box-shadow: 0 1px 0 var(--accent-dark), inset 0 1px 2px rgba(0, 0, 0, 0.1);
  transform: translateY(1px);
  font-weight: 700;
}

.period-empty {
  padding: 34px 0;
}

.main-bar {
  margin-bottom: 20px;
}

/* ============ 场景文件 树形子分类（国家 / 省 / 市 / 其他），左侧缩进展开、淡色 ============ */
.side-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.side-chevron {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  opacity: 0.55;
  transition: transform 0.18s ease;
  transform: rotate(0deg);
}

.side-chevron.open {
  transform: rotate(90deg);
}

.sidebar-item.active .side-chevron {
  opacity: 0.95;
}

/* 子分类容器（缩进展开） */
.scene-children {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 2px 0 4px 12px;
  padding-left: 8px;
  border-left: 1px solid var(--border);
  animation: childIn 0.18s ease-out;
}

@keyframes childIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 子分类按钮：淡色、非蓝色、扁平 */
.scene-child {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 13.5px;
  font-weight: 600;
  color: #475569;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  border-radius: 9px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  width: 100%;
  min-width: 0;
  transition: all 0.12s ease;
  overflow: visible;
}

.scene-child:hover {
  background: #e9edf2;
  border-color: #d1d5db;
  color: #334155;
}

.scene-child.active {
  background: #e2e8f0;
  color: #0f172a;
  border-color: #cbd5e1;
  font-weight: 700;
}

.sc-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #94a3b8;
  flex-shrink: 0;
}

.scene-child.active .sc-dot {
  background: var(--accent);
}

.sc-label {
  flex: 1;
  min-width: 0;
  white-space: normal;
  word-break: keep-all;
  overflow: visible;
}

.sc-count {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  background: rgba(15, 23, 42, 0.06);
  color: #64748b;
  padding: 2px 7px;
  border-radius: 8px;
  min-width: 18px;
  text-align: center;
}

.scene-child.active .sc-count {
  background: rgba(15, 23, 42, 0.10);
  color: #0f172a;
}

/* ============ 全部 / 昨日动态 / 往日动态 标签（右侧） ============ */
.period-tabs {
  display: flex;
  gap: 14px;
  margin-bottom: 22px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.period-tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1 1 0;
  max-width: 200px;
  min-width: 0;
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 700;
  color: #ea580c;
  background: linear-gradient(180deg, #ffffff 0%, #fff4ea 100%);
  border: 1px solid #fdba74;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  box-shadow: 0 5px 0 #fdba74, 0 8px 16px rgba(234, 88, 12, 0.18);
  transition: all 0.12s ease;
}

.period-tab:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 #fdba74, 0 12px 22px rgba(234, 88, 12, 0.24);
  background: linear-gradient(180deg, #ffffff 0%, #ffedd5 100%);
}

.period-tab.active {
  background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
  color: #fff;
  border-color: #c2410c;
  box-shadow: 0 2px 0 #c2410c, inset 0 2px 4px rgba(0, 0, 0, 0.12);
  transform: translateY(4px);
  font-weight: 800;
}

.period-tab .tab-count {
  font-size: 13px;
  font-weight: 800;
  background: rgba(234, 88, 12, 0.12);
  color: #c2410c;
  padding: 2px 10px;
  border-radius: 8px;
}

.period-tab.active .tab-count {
  background: rgba(255, 255, 255, 0.28);
  color: #fff;
}

/* ============ 新闻卡片网格 ============ */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.news-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  position: relative;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.06);
  animation: cardIn 0.4s ease-out backwards;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.news-card:hover {
  background: var(--bg-card-hover);
  border-color: #93c5fd;
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
}

.news-card-image {
  width: 100%;
  height: 160px;
  object-fit: cover;
  background: var(--bg-input);
}

.news-card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.news-card-tags {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.news-card-tag,
.news-card-region {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 5px;
  width: fit-content;
}

.news-card-tag .cat-icon {
  width: 12px;
  height: 12px;
  opacity: 0.9;
}

.news-card-region {
  background: var(--accent-soft);
  color: var(--accent);
}

.news-card-subtag {
  display: inline-flex;
  align-items: center;
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  background: #f3e8ff;
  color: #7c3aed;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.policy-label {
  font-size: 12.5px;
}

.tag-ai { background: var(--accent-ai-soft); color: var(--accent-ai); }
.tag-hot { background: var(--accent-hot-soft); color: var(--accent-hot); }
.tag-green { background: var(--accent-green-soft); color: var(--accent-green); }
.tag-orange { background: var(--accent-orange-soft); color: var(--accent-orange); }
.tag-blue { background: var(--accent-soft); color: var(--accent); }
.tag-rose { background: var(--accent-rose-soft); color: var(--accent-rose); }
.tag-case { background: #ccfbf1; color: #0f766e; }
.tag-policy { background: #ede9fe; color: #6d28d9; }

.news-card-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 8px;
  color: var(--text);
  word-break: break-word;
}

.news-card-summary {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}

.news-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.news-card-source {
  font-weight: 500;
  color: var(--text-secondary);
}

.news-card-time {
  display: flex;
  align-items: center;
  gap: 4px;
  font-variant-numeric: tabular-nums;
}

/* ============ 长城战略咨询深度解读文章列表 ============ */
.interp-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.interp-card {
  display: block;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 6px rgba(124, 58, 237, 0.06);
  animation: cardIn 0.4s ease-out backwards;
}

.interp-card:hover {
  background: var(--bg-card-hover);
  border-color: #c4b5fd;
  transform: translateY(-2px);

  '场景清单': 'tag-blue',        // 蓝：机会/需求/能力清单
  '支持政策': 'tag-policy',      // 紫：扶持/资金/人才/举措
  '场景案例': 'tag-case'         // 青：落地实践案例
};

function getTagClass(cat) {
  return CATEGORY_STYLES[cat] || 'tag-blue';
}

// 各分类线性图标（24x24）
const CATEGORY_ICONS = {
  '全部': '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  '场景文件': '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  '场景供需对接': '<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  '场景清单': '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6 5 7.5 7 4.5M3.5 12 5 13.5 7 10.5M3.5 18 5 19.5 7 16.5"/>',
  '支持政策': '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M8.5 12.5l1.8 1.8 3.2-3.6"/>',
  '场景案例': '<path d="M12 2l2.4 5.4L20 8.2l-4 4 1 5.8L12 15.8 7 18l1-5.8-4-4 5.6-.8z"/>'
};

function catIcon(cat) {
  const p = CATEGORY_ICONS[cat] || CATEGORY_ICONS['全部'];
  return `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function formatBucket(str) {
  const m = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return str;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return `${+m[2]}月${+m[3]}日 ${WEEK[d.getDay()]}`;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateShort(iso) {
  const m = (iso || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return iso || '';
  return `${+m[2]}月${+m[3]}日`;
}

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  // 必须用本地时间分量格式化，避免 toISOString() 在 UTC+8 下倒退一天
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 取浏览器本地当前日期（YYYY-MM-DD），用于计算「昨日 = 当前日期-1」
function ymdLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function byNewest(a, b) {
  return new Date(b.pubDate || 0) - new Date(a.pubDate || 0);
}

/**
 * 加载新闻数据
 */
async function loadNews(isRefresh = false) {
  try {
    // 始终带时间戳拉取，确保最新抓取数据即时生效（避免浏览器缓存旧 news.json）
    const url = 'data/news.json?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    allNews = data.items || [];
    // 昨日动态锚点：始终为「当前日期 - 1」（客户端真实日期，避免依赖可能滞后的 news.json queryDate）
    dataQueryDate = addDays(ymdLocal(new Date()), -1);
    dataCategories = data.categories || [];

    // 确保默认选中「全部」并同步按钮高亮
    currentPeriod = 'all';
    document.querySelectorAll('.period-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.period === 'all');
    });

    updateLastTime(data.lastUpdateFormatted);
    render();
  } catch (err) {
    console.error('加载失败:', err);
  }
}

/**
 * 加载长城战略咨询深度解读文章
 */
async function loadInterpretations() {
  try {
    const url = 'data/interpretations.json?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allInterps = data.items || [];
    render();
  } catch (err) {

}

/**
 * 渲染左侧栏分类导航（树形：场景文件 / 支持政策可展开细分子类）
 * - counts：各分类数量（按当前时期范围）
 * - levelCounts：场景文件下四级子分类数量

function renderSidebar(cats, counts, levelCounts, policyCounts) {
  const nav = document.getElementById('sidebarNav');
  let html = '';

  (cats || []).forEach(cat => {
    const count = counts[cat] || 0;

    if (cat === '场景文件') {
      // 父级项：带展开箭头
      const open = sceneFileOpen && currentCategory === '场景文件';
      html += `<button class="sidebar-item ${currentCategory === cat ? 'active' : ''} ${open ? 'open' : ''}"
                data-cat="${cat}" onclick="selectCategory('${cat}')">
                <span class="side-label">${catIcon(cat)}<span>${cat}</span></span>
                <span class="side-right">
                  <span class="side-count">${count}</span>
                  <svg class="side-chevron ${open ? 'open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </span>
              </button>`;
      // 展开的子分类
      if (open) {
        html += `<div class="scene-children">`;
        SCENE_LEVELS.forEach(lv => {
          const lc = levelCounts[lv] || 0;
          html += `<button class="scene-child ${currentSceneLevel === lv ? 'active' : ''}" data-lv="${lv}" onclick="selectSceneLevel('${lv}')">
                      <span class="sc-dot"></span>
                      <span class="sc-label">${lv}</span>
                      <span class="sc-count">${lc}</span>
                    </button>`;
        });
        html += `</div>`;
      }
    } else if (cat === '支持政策') {
      // 支持政策父级项：带展开箭头
      const open = policyOpen && currentCategory === '支持政策';
      html += `<button class="sidebar-item ${currentCategory === cat ? 'active' : ''} ${open ? 'open' : ''}"
                data-cat="${cat}" onclick="selectCategory('${cat}')">
                <span class="side-label">${catIcon(cat)}<span>${cat}</span></span>
                <span class="side-right">
                  <span class="side-count">${count}</span>
                  <svg class="side-chevron ${open ? 'open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </span>
              </button>`;
      // 展开的支持政策子分类
      if (open) {
        html += `<div class="scene-children">`;
        POLICY_TYPES.forEach(pt => {
          const pc = policyCounts[pt] || 0;
          html += `<button class="scene-child ${currentPolicyType === pt ? 'active' : ''}" data-pt="${pt}" onclick="selectPolicyType('${pt}')">
                      <span class="sc-dot"></span>
                      <span class="sc-label policy-label">${pt}</span>
                      <span class="sc-count">${pc}</span>
                    </button>`;
        });
        html += `</div>`;
      }
    } else {
      // 普通分类项
      html += `<button class="sidebar-item ${currentCategory === cat ? 'active' : ''}"
                data-cat="${cat}" onclick="selectCategory('${cat}')">
                <span class="side-label">${catIcon(cat)}<span>${cat}</span></span>
                <span class="side-count">${count}</span>
              </button>`;
    }
  });

  nav.innerHTML = html;
}

/**
 * 选择分类（左侧栏切换）
 * 场景文件 / 支持政策为树形父级：点击展开/收起子分类，并展示全部；再次点击当前分类可取消回到「全部」
 */
function selectCategory(cat) {
  currentView = 'news';
  if (cat === '场景文件') {
    if (currentCategory === '场景文件') {
      if (currentSceneLevel) {
        // 已选中某级别 → 回到「全部场景文件」，保持展开
        currentSceneLevel = null;
        sceneFileOpen = true;
      } else {
        // 未选级别 → 切换展开/收起
        sceneFileOpen = !sceneFileOpen;
        if (!sceneFileOpen) currentCategory = '全部';
      }
    } else {
      // 从其他分类切换过来 → 选中并展开
      currentCategory = '场景文件';
      sceneFileOpen = true;
      currentSceneLevel = null;
      policyOpen = false;
      currentPolicyType = null;
    }
  } else if (cat === '支持政策') {
    if (currentCategory === '支持政策') {
      if (currentPolicyType) {
        // 已选中某子类 → 回到「全部支持政策」，保持展开
        currentPolicyType = null;
        policyOpen = true;
      } else {
        // 未选子类 → 切换展开/收起
        policyOpen = !policyOpen;
        if (!policyOpen) currentCategory = '全部';
      }
    } else {
      // 从其他分类切换过来 → 选中并展开
      currentCategory = '支持政策';
      policyOpen = true;
      currentPolicyType = null;
      sceneFileOpen = false;
      currentSceneLevel = null;
    }
  } else {
    currentCategory = (currentCategory === cat) ? '全部' : cat;
    sceneFileOpen = false;
    currentSceneLevel = null;
    policyOpen = false;
    currentPolicyType = null;
  }
  render();
}

/**
 * 搜索（输入框实时过滤 + 搜索按钮 + 回车 + 清除）
 */
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchClear = document.getElementById('searchClear');

function applySearch() {
  searchKeyword = (searchInput.value || '').trim().toLowerCase();
  if (searchClear) searchClear.style.display = searchKeyword ? '' : 'none';
  render();
}
if (searchInput) searchInput.addEventListener('input', applySearch);
if (searchInput) searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); applySearch(); }
});
if (searchBtn) searchBtn.addEventListener('click', applySearch);

 * 再次点击同一按钮则返回昨日
 */
function selectDate(date) {
  selectedDate = (selectedDate === date) ? null : date;
  currentPeriod = 'today';
  document.querySelectorAll('.period-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.period === 'today');

/**
 * 渲染「昨日动态」板块内的 3 个追溯按钮：昨日-1、昨日-2、昨日-3（即 T-2、T-3、T-4）
 */
function renderDateNav() {
  const nav = document.getElementById('todayDateNav');
  if (!nav) return;
  if (!dataQueryDate) {
    nav.innerHTML = '';
    return;
  }
  const dates = [-1, -2, -3].map(n => addDays(dataQueryDate, n));
  const target = selectedDate || dataQueryDate;
  nav.innerHTML = dates.map(date => {
    const active = date === target ? 'active' : '';
    return `<button class="date-nav-btn ${active}" type="button" onclick="selectDate('${date}')">${formatDateShort(date)}</button>`;
  }).join('');
}

/**
 * 条目所属日期桶（用于昨日 / 往日分组）：优先用 queryDate，其次用 pubDate
 */
function bucketDate(item) {
  if (item.queryDate) return item.queryDate;
  if (item.pubDate) {
    const d = new Date(item.pubDate);
    if (!isNaN(d)) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
  }
  return 'unknown';
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function matchesKeyword(item) {
  return (item.title || '').toLowerCase().includes(searchKeyword) ||
         (item.summary || '').toLowerCase().includes(searchKeyword) ||
         (item.region || '').toLowerCase().includes(searchKeyword) ||
         (item.source || '').toLowerCase().includes(searchKeyword) ||
         (item.category || '').toLowerCase().includes(searchKeyword) ||
         (item.link || '').toLowerCase().includes(searchKeyword);
}

/**
 * 计算昨日动态 / 往日场景并渲染
 * - 时期标签（全部 / 昨日 / 往日）决定数据范围 scope
 * - 左侧分类数量按 scope 实际数据展示；标签上的数量按「当前分类+搜索」跨时期统计
 */
function render() {
  // 视图切换：动态 vs 长城战略咨询深度解读
  const newsView = document.getElementById('newsView');
  const interpView = document.getElementById('interpView');
  const newsBtn = document.getElementById('newsBtn');
  const interpBtn = document.getElementById('interpBtn');
  if (newsView) newsView.style.display = currentView === 'news' ? '' : 'none';
  if (interpView) interpView.style.display = currentView === 'interpretations' ? '' : 'none';
  if (newsBtn) newsBtn.classList.toggle('active', currentView === 'news');
  if (interpBtn) interpBtn.classList.toggle('active', currentView === 'interpretations');

  if (currentView === 'interpretations') {
    renderInterps();
    return;
  }

  const yStr = dataQueryDate;
  const hasSelected = currentPeriod === 'today' && selectedDate;
  const targetDate = hasSelected ? selectedDate : yStr;

  // 1) 时期标签决定范围；搜索时跨全部日期，不被时期标签限制
  //    选中追溯日期时，同时显示该日期与更早的往日动态
  let scope = allNews;
  if (searchKeyword) {
    scope = allNews;
  } else if (currentPeriod === 'today') {
    if (hasSelected) {
      scope = allNews.filter(i => bucketDate(i) <= selectedDate);
    } else {
      scope = allNews.filter(i => yStr && bucketDate(i) === yStr);
    }
  } else if (currentPeriod === 'past') {
    scope = allNews.filter(i => bucketDate(i) !== yStr);
  }
  // 'all' => 全部

  // 2) 标签合计数 = 各时期范围的固定总量（不受分类/搜索影响，点击分类时保持不变）
  const allCountTotal = allNews.length;
  const todayCountTotal = allNews.filter(i => yStr && bucketDate(i) === yStr).length;
  const pastCountTotal = allNews.filter(i => bucketDate(i) !== yStr).length;
  setText('tabAllCount', allCountTotal);
  setText('tabTodayCount', todayCountTotal);
  setText('tabPastCount', pastCountTotal);

  // 3) 左侧分类（不含全部），数量按当前标签范围统计
  const cats = getRealCategories();
  const counts = {};
  scope.forEach(item => { counts[item.category] = (counts[item.category] || 0) + 1; });

  // 3.5) 场景文件四级子分类数量（基于当前范围、且 category=场景文件）
  const levelCounts = { '国家': 0, '省': 0, '市': 0, '其他': 0 };
  scope.filter(i => i.category === '场景文件').forEach(i => {
    const k = i.regionLevel || '其他';
    levelCounts[k] = (levelCounts[k] || 0) + 1;
  });

  // 3.6) 支持政策五类细分子类数量（基于当前范围、且 category=支持政策）
  const policyCounts = {};
  POLICY_TYPES.forEach(pt => policyCounts[pt] = 0);
  scope.filter(i => i.category === '支持政策').forEach(i => {
    const k = i.policyType || '支持场景示范项目';
    policyCounts[k] = (policyCounts[k] || 0) + 1;
  });

  renderSidebar(cats, counts, levelCounts, policyCounts);

  // 4) 卡片 = 范围 ∩ 分类 ∩ 搜索
  let filtered = scope;
  if (currentCategory !== '全部') filtered = filtered.filter(i => i.category === currentCategory);
  if (searchKeyword) filtered = filtered.filter(i => matchesKeyword(i));
  // 场景文件四级子筛选（国家 / 省 / 市 / 其他）
  if (currentCategory === '场景文件' && currentSceneLevel) {
    filtered = filtered.filter(i => (i.regionLevel || '其他') === currentSceneLevel);
  }
  // 支持政策五类子筛选
  if (currentCategory === '支持政策' && currentPolicyType) {
    filtered = filtered.filter(i => (i.policyType || '支持场景示范项目') === currentPolicyType);
  }

  const todayItems = filtered
    .filter(i => targetDate && bucketDate(i) === targetDate)
    .slice().sort(byNewest);
  const pastItems = hasSelected
    ? filtered.filter(i => bucketDate(i) < selectedDate).slice().sort(byNewest)
    : filtered.filter(i => bucketDate(i) !== yStr).slice().sort(byNewest);

  // 5) 板块显隐
  const showToday = currentPeriod === 'today' || currentPeriod === 'all';
  const showPast = currentPeriod === 'past' || currentPeriod === 'all' || hasSelected;
  document.getElementById('todaySection').style.display = showToday ? '' : 'none';
  document.getElementById('pastSection').style.display = showPast ? '' : 'none';

  const td = document.getElementById('todayDate');
  if (td) td.textContent = targetDate ? formatBucket(targetDate) : '';

  const tt = document.getElementById('todayTitle');
  if (tt) tt.textContent = (targetDate && targetDate !== yStr) ? `${formatDateShort(targetDate)} 动态` : '昨日动态';

  renderDateNav();
  renderGrid('todayGrid', 'todayEmpty', todayItems);
  renderGrid('pastGrid', 'pastEmpty', pastItems);
}

/**
 * 渲染某个板块的卡片网格
 */
function renderGrid(gridId, emptyId, items) {
  const grid = document.getElementById(gridId);
  const empty = document.getElementById(emptyId);
  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    empty.querySelector('p').textContent = searchKeyword ? '没有匹配的动态' : '该板块暂无动态';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = items.map((item, idx) => cardHtml(item, idx)).join('');
}

/**
 * 渲染长城战略咨询深度解读文章列表
 * - 每行一条，显示完整标题 + 概括，点击跳转原文
 */
function renderInterps() {
  const grid = document.getElementById('interpGrid');
  const empty = document.getElementById('interpEmpty');
  if (!grid || !empty) return;

  let items = allInterps || [];
  if (searchKeyword) {
    const kw = searchKeyword;
    items = items.filter(i =>
      (i.title || '').toLowerCase().includes(kw) ||
      (i.summary || '').toLowerCase().includes(kw)
    );
  }
  items = items.slice().sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    empty.querySelector('p').textContent = searchKeyword ? '没有匹配的解读文章' : '暂无解读文章';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = items.map((item, idx) => interpCardHtml(item, idx)).join('');
}

function interpCardHtml(item, idx) {
  const dateStr = formatDate(item.pubDate);
  return `<a class="interp-card" href="${item.link || '#'}" target="_blank" rel="noopener" style="animation-delay:${Math.min(idx * 0.04, 0.4)}s">
    <div class="interp-card-meta">
      <span class="interp-card-source">长城战略咨询</span>
      <span class="interp-card-time">${dateStr}</span>
    </div>
    <div class="interp-card-title">${escapeHtml(item.title)}</div>
    ${item.summary ? `<div class="interp-card-summary">${escapeHtml(item.summary)}</div>` : ''}
  </a>`;
}

function cardHtml(item, idx) {
  const tagClass = getTagClass(item.category);
  const region = item.region || '其他';
  const imageHtml = item.image
    ? `<img class="news-card-image" src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : '';
  const dateStr = formatDate(item.pubDate);
  const policySubTag = item.policyType
    ? `<span class="news-card-subtag">${escapeHtml(item.policyType)}</span>`
    : '';

  return `<a class="news-card" href="${item.link || '#'}" target="_blank" rel="noopener" style="animation-delay:${Math.min(idx * 0.04, 0.4)}s">
    ${imageHtml}
    <div class="news-card-body">
      <div class="news-card-tags">
        <span class="news-card-tag ${tagClass}">${catIcon(item.category)}${item.category}</span>
        ${policySubTag}
        <span class="news-card-region">${escapeHtml(region)}</span>
      </div>
      <div class="news-card-title">${escapeHtml(item.title)}</div>
      ${item.summary ? `<div class="news-card-summary">${escapeHtml(item.summary)}</div>` : ''}
      <div class="news-card-footer">
        <span class="news-card-source">${item.source}</span>
        <span class="news-card-time">${dateStr}</span>
      </div>
    </div>
  </a>`;
}

/**
 * 更新最后更新时间
 */
function updateLastTime(timeStr) {
  const el = document.querySelector('.update-text');
  if (el && timeStr) {
    el.textContent = '更新于 ' + timeStr;
  } else if (el) {
    el.textContent = '已更新';
  }

  const footerMeta = document.getElementById('footerMeta');
  if (footerMeta) {
    footerMeta.textContent = `数据来源：官方新闻检索聚合 | 最后更新：${timeStr || '未知'}`;
  }
}

/**
 * HTML 转义
 */
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  }[c]));
}

// 页面加载后启动
loadNews();
loadInterpretations();

/**
 * 浏览次数统计
 * - 用 sessionStorage 标记「本次会话已计数」，刷新（同标签页 F5）不会重复计数；
 * - 用 localStorage 持久累计真实进入次数（按来源/端口分别计数：公网链接与本地桌面文件各自独立）；
 * - 每 5 分钟的数据自动刷新是 AJAX 拉取，不会触发此处（仅整页加载才计）。
 */
function trackPageView() {
  const SESSION_KEY = 'scene_page_session_v1';
  const STORE_KEY = 'scene_view_count_v1';
  try {
    if (!sessionStorage.getItem(SESSION_KEY)) {
      let n = parseInt(localStorage.getItem(STORE_KEY) || '0', 10);
      if (isNaN(n)) n = 0;
      n += 1;
      localStorage.setItem(STORE_KEY, String(n));
      sessionStorage.setItem(SESSION_KEY, '1'); // 标记本次会话已计数，刷新不再计
    }
  } catch (e) { /* 隐私模式等场景静默降级 */ }
  const el = document.getElementById('viewCount');
  if (el) {
    let n = parseInt(localStorage.getItem(STORE_KEY) || '0', 10);
    if (isNaN(n)) n = 0;
    el.textContent = n.toLocaleString('zh-CN');
  }
}
trackPageView();


// 每5分钟自动刷新数据
setInterval(() => { loadNews(true); loadInterpretations(); }, 5 * 60 * 1000);

</script>
</body>
